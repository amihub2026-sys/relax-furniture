/* =====================================================
   HTML ELEMENTS
===================================================== */

const amazonProductsSection =
    document.getElementById("amazonProductsSection");

const amazonProductsGrid =
    document.getElementById("amazonProductsGrid");

const productNotFound =
    document.getElementById("productNotFound");


/* =====================================================
   GET PRODUCT FROM URL
===================================================== */

const parameters =
    new URLSearchParams(window.location.search);

const productKey =
    parameters.get("product");


/* =====================================================
   FIND SELECTED PRODUCT
===================================================== */

const selectedProduct =
    products.find(function (product) {

        return product.id === productKey;

    });


/* =====================================================
   PRODUCT FOUND
===================================================== */

if (selectedProduct) {

    if (amazonProductsSection) {
        amazonProductsSection.style.display = "block";
    }

    if (productNotFound) {
        productNotFound.style.display = "none";
    }

    document.title =
        selectedProduct.title + " | Futuriture";


    /* CLEAR OLD CONTENT */

    if (amazonProductsGrid) {
        amazonProductsGrid.innerHTML = "";
    }


    /* =================================================
       SHOW SELECTED PRODUCT
    ================================================= */

    const selectedWhatsappMessage =
        "Hello Futuriture, I am interested in " +
        selectedProduct.title +
        ". Please share more details.";

    const selectedWhatsappLink =
        "https://wa.me/919876543210?text=" +
        encodeURIComponent(selectedWhatsappMessage);


    const selectedCard =
        document.createElement("article");

    selectedCard.className =
        "amazon-product-card selected-product-card";

    selectedCard.innerHTML = `

        <div class="amazon-product-image">

            <img
                src="${selectedProduct.image}"
                alt="${selectedProduct.title}">

        </div>

        <div class="amazon-product-body">

            <span class="amazon-category">
                ${selectedProduct.categoryName}
            </span>

            <h2 class="amazon-product-title">
                ${selectedProduct.title}
            </h2>

            <div class="amazon-rating">

                <span class="amazon-stars">
                    ${selectedProduct.rating}
                </span>

                <span class="amazon-rating-count">
                    (${selectedProduct.reviewCount} reviews)
                </span>

            </div>

            <p class="amazon-product-description">
                ${selectedProduct.description}
            </p>

            <strong class="amazon-price">
                ${selectedProduct.price}
            </strong>

            <a
                href="${selectedWhatsappLink}"
                target="_blank"
                rel="noopener"
                class="amazon-whatsapp-button">

                Order Through WhatsApp

            </a>

        </div>
    `;

    if (amazonProductsGrid) {
        amazonProductsGrid.appendChild(selectedCard);
    }


    /* =================================================
       GET ONLY SAME CATEGORY PRODUCTS
    ================================================= */

    const relatedProducts =
        products.filter(function (product) {

            return (
                product.category === selectedProduct.category &&
                product.id !== selectedProduct.id
            );

        });


    /* =================================================
       SHOW RELATED PRODUCTS
    ================================================= */

    relatedProducts.forEach(function (product) {

        const productPageLink =
            "product-details.html?product=" +
            encodeURIComponent(product.id);

        const whatsappMessage =
            "Hello Futuriture, I am interested in " +
            product.title +
            ". Please share more details.";

        const whatsappLink =
            "https://wa.me/919876543210?text=" +
            encodeURIComponent(whatsappMessage);


        const card =
            document.createElement("article");

        card.className =
            "amazon-product-card";

        card.innerHTML = `

            <a
                href="${productPageLink}"
                class="amazon-product-image">

                <img
                    src="${product.image}"
                    alt="${product.title}"
                    loading="lazy">

            </a>

            <div class="amazon-product-body">

                <span class="amazon-category">
                    ${product.categoryName}
                </span>

                <a
                    href="${productPageLink}"
                    class="amazon-product-title">

                    ${product.title}

                </a>

                <div class="amazon-rating">

                    <span class="amazon-stars">
                        ${product.rating}
                    </span>

                    <span class="amazon-rating-count">
                        (${product.reviewCount})
                    </span>

                </div>

                <p class="amazon-product-description">
                    ${product.description}
                </p>

                <strong class="amazon-price">
                    ${product.price}
                </strong>

                <div class="amazon-card-actions">

                    <a
                        href="${productPageLink}"
                        class="amazon-view-button">

                        View Product

                    </a>

                    <a
                        href="${whatsappLink}"
                        target="_blank"
                        rel="noopener"
                        class="amazon-whatsapp-button">

                        WhatsApp

                    </a>

                </div>

            </div>
        `;

        if (amazonProductsGrid) {
            amazonProductsGrid.appendChild(card);
        }

    });

}


/* =====================================================
   PRODUCT NOT FOUND
===================================================== */

else {

    if (amazonProductsSection) {
        amazonProductsSection.style.display = "none";
    }

    if (productNotFound) {
        productNotFound.style.display = "block";
    }

}
